# WhatsApp gateway for Unified Box ("WhatsApp (scan QR)"), using WAHA (https://github.com/devlikeapro/waha, Apache-2.0).
# Run on any always-on Linux server with Docker (e.g. a Hetzner CX22). Put it behind HTTPS (Caddy below).
#   1. Copy .env.example to .env and fill in the three values.
#   2. Point a DNS name (e.g. wa.yourdomain.com) at the server, set WA_DOMAIN in .env.
#   3. docker compose up -d
services:
  waha:
    image: devlikeapro/waha:latest      # pin a tested version once it works; GOWS is selected below
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WA_GATEWAY_KEY}              # same value as WA_GATEWAY_KEY in Vercel
      WHATSAPP_DEFAULT_ENGINE: GOWS                # WAHA's engine that supports WhatsApp's new passkey linking step
      WAHA_DASHBOARD_ENABLED: "false"              # no web dashboard exposed to the internet
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"        # reconnect every linked phone after a reboot
      WAHA_LOG_LEVEL: info
    volumes:
      - ./sessions:/app/.sessions                  # keep links across restarts (back this folder up)
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${WA_DOMAIN} --to waha:3000
    volumes:
      - ./caddy-data:/data
